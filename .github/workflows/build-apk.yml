name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and patch the Android project
        run: bash tools/setup_android.sh

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk micro-reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: micro-reader-apk
          path: micro-reader.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Micro Reader build ${{ github.run_number }}
          body: |
            Download `micro-reader.apk` below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser.
          files: micro-reader.apk
