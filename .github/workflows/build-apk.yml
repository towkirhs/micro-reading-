name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and patch the Android project
        run: bash tools/setup_android.sh 2>&1 | tee setup.log

      - name: Install packages
        run: flutter pub get 2>&1 | tee pub.log

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Surface errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for name in ("setup", "pub", "analyze", "test", "build"):
              p = pathlib.Path(name + ".log")
              if not p.exists():
                  continue
              lines = p.read_text(errors="replace").splitlines()
              hits = [i for i, l in enumerate(lines) if "What went wrong" in l or " error " in l.lower() or "Error:" in l or "[E]" in l or "FAILED" in l]
              if hits:
                  i = hits[0]
                  print(f"::error title={name}: first error::" + esc("\n".join(lines[max(0, i - 3):i + 25])))
              print(f"::error title={name}: log tail::" + esc("\n".join(lines[-30:])))
          PY

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk micro-reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: micro-reader-apk
          path: micro-reader.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Micro Reader build ${{ github.run_number }}
          body: |
            Download `micro-reader.apk` below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser.
          files: micro-reader.apk
