name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and patch the Android project
        run: bash tools/setup_android.sh

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("build.log")
          lines = p.read_text(errors="replace").splitlines() if p.exists() else ["no build.log"]
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          wrong = [i for i, l in enumerate(lines) if "What went wrong" in l or "Error:" in l or "error:" in l]
          if wrong:
              i = wrong[0]
              print("::error title=First error::" + esc("\n".join(lines[max(0, i - 3):i + 25])))
          print("::error title=Log tail::" + esc("\n".join(lines[-40:])))
          PY

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk micro-reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: micro-reader-apk
          path: micro-reader.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Micro Reader build ${{ github.run_number }}
          body: |
            Download `micro-reader.apk` below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser.
          files: micro-reader.apk
